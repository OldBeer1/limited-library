appId: com.oldbeer.limitedlibrary
productName: Limited Library
directories:
  app: apps/desktop
  output: output/windows
  buildResources: apps/desktop
files:
  - main.js
  - package.json
  - icon.ico
asar: true
npmRebuild: false
extraResources:
  - from: output/desktop/backend
    to: backend
  # The builder excludes a root node_modules in generic resource mappings.
  - from: output/desktop/backend/node_modules
    to: backend/node_modules
win:
  icon: apps/desktop/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Limited-Library-Setup-${version}-${arch}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Limited Library
  uninstallDisplayName: Limited Library
  deleteAppDataOnUninstall: false
  installerLanguages: [zh_CN, en_US]
  language: '2052'
